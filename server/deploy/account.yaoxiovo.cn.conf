server {
    listen 80;
    listen [::]:80;
    server_name account.yaoxiovo.cn accounts.yaoxi.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name account.yaoxiovo.cn;
    ssl_certificate /etc/yaoxi-accounts/tls/account-fullchain.pem;
    ssl_certificate_key /etc/yaoxi-accounts/tls/account-privkey.pem;
    include /etc/yaoxi-accounts/nginx-app.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name accounts.yaoxi.cloud;
    ssl_certificate /etc/yaoxi-accounts/tls/fullchain.pem;
    ssl_certificate_key /etc/yaoxi-accounts/tls/privkey.pem;
    include /etc/yaoxi-accounts/nginx-app.conf;
}
